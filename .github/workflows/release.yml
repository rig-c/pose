# Release a deliberate vX.Y.Z tag after an HQ-signed version PR merges.
# Keep this filename, GitHub-hosted publishing, and the blank environment:
# npm trusted publishing is bound to release.yml. Provenance names GITHUB_SHA.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: An existing vX.Y.Z tag to publish (leave version empty)
        required: false
        type: string
      version:
        description: A published version to confirm only (leave tag empty)
        required: false
        type: string

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: ${{ github.event_name == 'push' || inputs.tag != '' || inputs.version == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.target.outputs.publish }}
      tag: ${{ steps.target.outputs.tag }}
      sha: ${{ steps.target.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve the tag to publish
        id: target
        env:
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = push ]; then
            case "$GITHUB_REF" in
              refs/tags/*) release_tag="${GITHUB_REF#refs/tags/}" ;;
              *) echo "::error::RELEASE_REF_NOT_TAG: $GITHUB_REF is not a tag ref"; exit 1 ;;
            esac
          elif [ "$EVENT" = workflow_dispatch ]; then
            if [ -z "$INPUT_TAG" ] || [ -n "$INPUT_VERSION" ]; then echo "::error::RELEASE_DISPATCH_INPUT: give exactly one of tag (publish) or version (confirm only)"; exit 1; fi
            release_tag="$INPUT_TAG"
          else
            echo "::error::RELEASE_REF_NOT_TAG: unsupported event $EVENT"; exit 1
          fi
          if [[ ! "$release_tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then echo "::error::RELEASE_TAG_FORM: $release_tag is not vX.Y.Z"; exit 1; fi
          if [ "$GITHUB_REF" != "refs/tags/$release_tag" ]; then echo "::error::RELEASE_REF_NOT_TAG: $GITHUB_REF is not refs/tags/$release_tag; dispatch with --ref $release_tag"; exit 1; fi
          # The commits API peels lightweight and annotated tags alike.
          if ! tag_sha="$(gh api "repos/$REPO/commits/refs%2Ftags%2F$release_tag" --jq .sha)"; then echo "::error::RELEASE_TAG_UNRESOLVED: cannot resolve $release_tag to a commit"; exit 1; fi
          if [[ ! "$tag_sha" =~ ^[0-9a-f]{40}$ ]]; then echo "::error::RELEASE_TAG_UNRESOLVED: $release_tag did not resolve to a full commit SHA"; exit 1; fi
          if [ "$GITHUB_SHA" != "$tag_sha" ]; then echo "::error::PROVENANCE_SHA_MISMATCH: the run's GITHUB_SHA $GITHUB_SHA is not $release_tag's commit $tag_sha; the tag remains cut; recover with gh workflow run release.yml --ref $release_tag -f tag=$release_tag"; exit 1; fi
          if ! local_sha="$(git rev-parse --verify --quiet "refs/tags/$release_tag^{commit}")"; then echo "::error::RELEASE_TAG_UNRESOLVED: fetched tag $release_tag is missing"; exit 1; fi
          if [ "$local_sha" != "$tag_sha" ]; then echo "::error::PROVENANCE_SHA_MISMATCH: fetched tag $release_tag ($local_sha) differs from $tag_sha"; exit 1; fi
          if ! git merge-base --is-ancestor "$tag_sha" refs/remotes/origin/main; then echo "::error::RELEASE_TAG_NOT_ON_MAIN: $release_tag ($tag_sha) is not reachable from origin/main"; exit 1; fi
          version="${release_tag#v}"
          if ! pkg_json="$(git show "$tag_sha:package.json")"; then echo "::error::RELEASE_TAG_VERSION_MISMATCH: cannot read package.json at $tag_sha"; exit 1; fi
          if ! pkg_id="$(PKG_JSON="$pkg_json" node -e 'const p=JSON.parse(process.env.PKG_JSON); process.stdout.write(`${p.name}@${p.version}`)' 2>/dev/null)"; then echo "::error::RELEASE_TAG_VERSION_MISMATCH: invalid package.json at $tag_sha"; exit 1; fi
          if [ "$pkg_id" != "@rig-c/pose@$version" ]; then echo "::error::RELEASE_TAG_VERSION_MISMATCH: $release_tag has $pkg_id, expected @rig-c/pose@$version"; exit 1; fi
          if served="$(npm view "@rig-c/pose@$version" version 2>/dev/null)" && [ "$served" = "$version" ]; then echo "::error::RELEASE_ALREADY_PUBLISHED: the registry already serves @rig-c/pose@$version"; exit 1; fi
          # Semver order with a prerelease below its release, in node rather than `sort -V`, which sorts 1.0.0-rc.1 after 1.0.0.
          if latest="$(npm view "@rig-c/pose" version 2>/dev/null)" && [ -n "$latest" ] && [ "$(VERSION="$version" LATEST="$latest" node -e '
            const parse = (v) => { const [core, pre] = v.split("-", 2); return { core: core.split(".").map(Number), pre: pre === undefined ? null : pre.split(".") }; };
            const ids = (a, b) => { for (let i = 0; i < Math.max(a.length, b.length); i++) { if (a[i] === undefined) return -1; if (b[i] === undefined) return 1; const na = /^[0-9]+$/.test(a[i]), nb = /^[0-9]+$/.test(b[i]); if (na && nb && Number(a[i]) !== Number(b[i])) return Number(a[i]) - Number(b[i]); if (na !== nb) return na ? -1 : 1; if (!na && a[i] !== b[i]) return a[i] < b[i] ? -1 : 1; } return 0; };
            const cmp = (x, y) => { const a = parse(x), b = parse(y); for (let i = 0; i < 3; i++) if (a.core[i] !== b.core[i]) return a.core[i] - b.core[i]; if (a.pre === null || b.pre === null) return a.pre === b.pre ? 0 : a.pre === null ? 1 : -1; return ids(a.pre, b.pre); };
            process.stdout.write(cmp(process.env.VERSION, process.env.LATEST) < 0 ? "below" : "not-below");
          ')" = below ]; then echo "::error::RELEASE_TAG_BELOW_LATEST: $release_tag is below the registry's latest @rig-c/pose@$latest; republish under a dist-tag with a \`--tag\` variant of this dispatch (a follow-up), not under latest; npm refuses that implicitly"; exit 1; fi
          echo "publish=true" >> "$GITHUB_OUTPUT"; echo "tag=$release_tag" >> "$GITHUB_OUTPUT"; echo "sha=$tag_sha" >> "$GITHUB_OUTPUT"

  publish:
    needs: release
    if: ${{ needs.release.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # OIDC for npm trusted publishing; no environment
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.sha }}
      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Node 22 ships npm 10; the OIDC exchange landed in npm 11.5.1.
      - name: Use an npm that speaks OIDC
        run: |
          npm install -g npm@12.2.2
          npm --version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Nothing to build — the package ships TypeScript sources and bun runs
      # them. prepublishOnly runs typecheck, lint and the tests against the
      # tagged tree, so a broken gate fails the publish rather than shipping.
      - name: Publish to npm
        run: |
          set -euo pipefail
          npm publish --provenance --access public

      - name: Publish the alias rig-pose
        run: |
          set -euo pipefail
          alias_tgz="$(bun scripts/alias_tarball.ts pack --name rig-pose --out "$RUNNER_TEMP/pose-alias")"
          npm publish "$alias_tgz" --provenance --access public

      - name: Confirm the published package installs and runs
        env:
          TAG_NAME: ${{ needs.release.outputs.tag }}
        run: bash scripts/confirm_registry.sh "${TAG_NAME#v}" 15

  # Confirmation publishes nothing and has no OIDC write permission.
  confirm:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.version != '' && inputs.tag == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ inputs.version }}
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Confirm the published package installs and runs
        env:
          VERSION: ${{ inputs.version }}
        run: bash scripts/confirm_registry.sh "$VERSION" 15
