# CI: typecheck, lint, the tests, and what a landing ships.
#
# The tests are the gate that matters. Every check in them has a planted input
# that makes it fire beside the control that must not, so a green run means the
# failures are still reachable — not merely that nothing threw.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Keep the original commands once, off the measured shard + merge path.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - name: Preserve whole tests, fixture declarations, and cleanup
        run: python3 scripts/test-shards.py preserve
      - name: The real merger refuses omitted, duplicate, and unknown files
        run: python3 scripts/test-shards.py controls --scratch "$RUNNER_TEMP/shard-controls"
      - name: Plan from this tree independently of shard results
        run: bun scripts/test-shards.ts plan . "$RUNNER_TEMP/test-plan.json"
      - uses: actions/upload-artifact@v4
        with:
          name: test-plan
          path: ${{ runner.temp }}/test-plan.json
          if-no-files-found: error

  test-shards:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      # The bin shim is a Node script and the CLI test runs it through node.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - name: One serial Bun process for the assigned files
        env:
          TEST_SHARD: ${{ matrix.shard }}
          TEST_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          GATE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GATE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GATE_PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 scripts/test-shards.py run --id "$TEST_SHARD" --out "$RUNNER_TEMP/test-results" --head "$TEST_HEAD"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-shard-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/test-results/*.json
            ${{ runner.temp }}/test-results/*.xml
            ${{ runner.temp }}/test-results/*.log
          if-no-files-found: error

  # This exact job name is required by branch protection. Never infer success
  # from a skipped matrix or missing artifact; the merger checks both.
  test:
    if: always()
    needs: [checks, test-shards]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: test-plan
          path: ${{ runner.temp }}/test-plan
      - uses: actions/download-artifact@v4
        with:
          pattern: test-shard-*
          path: ${{ runner.temp }}/test-shards
      - name: Every prerequisite succeeded, every file ran once, identities match
        env:
          TEST_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          TEST_NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 scripts/test-shards.py merge --plan "$RUNNER_TEMP/test-plan/test-plan.json" --artifacts "$RUNNER_TEMP/test-shards" --out "$RUNNER_TEMP/test-merged" --head "$TEST_HEAD" --needs "$TEST_NEEDS"
          cat "$RUNNER_TEMP/test-merged/before-after.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-merged
          path: ${{ runner.temp }}/test-merged
          if-no-files-found: warn

  # rig-c/pose#377 (1.0 gate ⑤ of #217): every issue the known-limits list in
  # docs/REFERENCE.md names is open and labelled `parked`. It reads the network, so it is a
  # step here and not a test: `bun run test` stays offline, and test/scope.test.ts
  # holds the list's shape and this step's judgement on planted states. #46 is
  # closed (#261) and is judged first by the same code; it must come back
  # refused, or the green verdict after it means nothing.
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Every known limit rests on an open parked issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/scope_issues.ts --closed-control 46

  # rig-c/pose#260: the package as npm would pack it, installed into an empty
  # directory and used there — --version, then a retarget of the public wave to
  # its pinned bytes — beside three planted failures that must each go red at the
  # step named (scripts/smoke_mutants.sh). The registry confirmation after a
  # publish runs the same smoke (scripts/confirm_registry.sh).
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: The install retargets the wave, and its planted failures are red
        run: |
          set -euo pipefail
          d=$(mktemp -d)
          npm pack --pack-destination "$d" > /dev/null
          bash scripts/smoke_mutants.sh "$d"/*.tgz "$(node -p 'require("./package.json").version')"

  # Keep the branch-protection check name; exercise both release packages on the exact publishing npm, without credentials.
  ships:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@12.2.2
      - run: npm --version
      - run: bun install --frozen-lockfile
      # npm publish from the source runs this hook; no build is needed for TypeScript.
      - run: bun run prepublishOnly
      - name: Pack both publication names without publishing
        run: |
          set -euo pipefail
          npm pack --dry-run --json
          alias_tgz="$(bun scripts/alias_tarball.ts pack --name rig-pose --out "$RUNNER_TEMP/pose-alias")"
          npm pack "$alias_tgz" --dry-run --json
